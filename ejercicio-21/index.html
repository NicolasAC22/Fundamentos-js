<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 21 - Filtrar mayores</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Ejercicio 21: Filtrar números mayores</h1>
    <p>Introduce un array numérico y un límite. Se mostrarán solo los números estrictamente mayores que el límite.</p>

    <label for="numeros">Array de números:</label>
    <input type="text" id="numeros" value="2, 5, 8, 10, 12">

    <label for="limite">Valor límite:</label>
    <input type="number" id="limite" value="8">

    <button id="ejecutar">Filtrar números</button>

    <h2>Resultado</h2>
    <div id="salida"></div>
</body>
</html>
