<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2 - Números aleatorios</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Ejercicio 2: Array aleatorio</h1>
    <p>Genera 100 números aleatorios y filtra los comprendidos entre dos límites.</p>

    <label for="minimo">Mínimo:</label>
    <input type="number" id="minimo" value="20">

    <label for="maximo">Máximo:</label>
    <input type="number" id="maximo" value="60">

    <button id="ejecutar">Generar y filtrar</button>

    <h2>Resultado</h2>
    <div id="salida"></div>
</body>
</html>
