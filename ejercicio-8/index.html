<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 8 - Número aleatorio</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Ejercicio 8: Número aleatorio</h1>
    <p>Genera diez enteros entre un mínimo y un máximo, ambos incluidos.</p>

    <label for="minimo">Mínimo:</label>
    <input type="number" id="minimo" value="-5">

    <label for="maximo">Máximo:</label>
    <input type="number" id="maximo" value="10">

    <button id="ejecutar">Generar números</button>

    <h2>Resultado</h2>
    <div id="salida"></div>
</body>
</html>
