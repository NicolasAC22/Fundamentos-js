<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 16 - Temperaturas</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Ejercicio 16: Conversor de temperatura</h1>
    <p>Convierte grados Celsius a Fahrenheit.</p>

    <label for="celsius">Temperatura en Celsius:</label>
    <input type="number" id="celsius" value="0" step="any">

    <button id="ejecutar">Convertir</button>

    <h2>Resultado</h2>
    <div id="salida"></div>
</body>
</html>
