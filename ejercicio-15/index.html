<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 15 - Números primos</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Ejercicio 15: Números primos</h1>
    <p>Introduce un límite para encontrar todos los primos desde 1.</p>

    <label for="limite">Límite:</label>
    <input type="number" id="limite" value="20" min="1" max="100000">

    <button id="ejecutar">Buscar primos</button>

    <h2>Resultado</h2>
    <div id="salida"></div>
</body>
</html>
